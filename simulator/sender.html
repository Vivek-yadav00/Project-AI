<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Phone — DadaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        .smartphone {
            width: 320px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 36px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .smartphone-screen {
            background: #0d1117;
            border-radius: 26px;
            overflow: hidden;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }
        .notch {
            width: 90px; height: 24px;
            background: #0f172a;
            border-radius: 0 0 16px 16px;
            margin: 0 auto;
            position: relative; z-index: 10;
        }
        .notch::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: #334155; position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%);
        }
        .msg-bubble {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12.5px;
            line-height: 1.45;
            word-break: break-word;
        }
        .msg-sent {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .msg-received {
            background: #1e293b;
            color: #cbd5e1;
            border-bottom-left-radius: 4px;
        }
        .chip {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            color: #93c5fd;
        }
        .chip:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #fff;
            transform: translateY(-1px);
        }
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="flex flex-col items-center gap-4">
        <!-- Status Indicator -->
        <div class="text-center">
            <span class="text-xs font-semibold text-blue-400 tracking-wider uppercase">
                <i class="fas fa-paper-plane mr-1"></i> Caregiver Terminal (4G)
            </span>
            <div class="text-[10px] text-gray-500 mt-1 flex items-center justify-center gap-2">
                <span>Mode: <strong id="currentMode">Mock</strong></span>
                <span class="w-1.5 h-1.5 rounded-full inline-block" id="statusDot" style="background-color: #22c55e;"></span>
            </div>
        </div>

        <!-- Phone Casing -->
        <div class="smartphone">
            <div class="smartphone-screen">
                <div class="notch"></div>
                
                <!-- Status bar -->
                <div class="flex justify-between items-center px-4 py-1 text-[10px] text-gray-400">
                    <span id="currentTime">19:04</span>
                    <div class="flex items-center gap-1.5">
                        <i class="fas fa-signal text-[8px]"></i>
                        <span class="text-[8px] font-bold">5G</span>
                        <i class="fas fa-wifi text-[8px]"></i>
                        <i class="fas fa-battery-full text-[8px]"></i>
                    </div>
                </div>

                <!-- Chat Header -->
                <div class="bg-[#161b22] px-4 py-2 flex items-center gap-2 border-b border-gray-800">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white text-[11px] font-bold">दा</div>
                    <div>
                        <div class="text-xs font-semibold text-white">Dada Ji</div>
                        <div class="text-[9px] text-green-400" id="receiverStatusText">Sync Active</div>
                    </div>
                    <div class="ml-auto flex gap-3.5 text-gray-500">
                        <i class="fas fa-phone text-xs cursor-pointer hover:text-green-400 transition"></i>
                        <i class="fas fa-ellipsis-v text-xs cursor-pointer hover:text-white transition"></i>
                    </div>
                </div>

                <!-- Messages Stream -->
                <div id="chatMessages" class="flex-1 p-3 flex flex-col gap-2.5 overflow-y-auto" style="max-height: 290px; min-height: 290px;">
                    <div class="text-center text-[9px] text-gray-600 py-1">
                        <i class="fas fa-lock text-[8px] mr-1"></i> Messages are shared across simulation windows.
                    </div>
                </div>

                <!-- Input Panel -->
                <div class="bg-[#161b22] px-3 py-2 border-t border-gray-800">
                    <div class="flex items-center gap-2">
                        <input id="msgInput" type="text" placeholder="Type message to Dada Ji..."
                            class="flex-1 bg-[#0d1117] text-white text-xs px-3.5 py-2 rounded-full border border-gray-700 outline-none focus:border-blue-500 transition placeholder:text-gray-600">
                        <button id="sendBtn" onclick="sendSMS()"
                            class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-blue-600 flex items-center justify-center text-white text-xs hover:scale-105 active:scale-95 transition-transform">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    
                    <!-- Quick chips -->
                    <div class="flex flex-wrap gap-1 mt-2.5">
                        <span class="chip" onclick="quickSend(this)">Dada ji kal 5 baje ghar aa jana</span>
                        <span class="chip" onclick="quickSend(this)">Your OTP is 483921</span>
                        <span class="chip" onclick="quickSend(this)">Your electricity bill of Rs 850 is due</span>
                        <span class="chip" onclick="quickSend(this)">Dawa le lena</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Setup BroadcastChannel
        const bc = new BroadcastChannel('dadaai_channel');
        
        // Settings loaded from localStorage
        const settings = {
            get mode() { return localStorage.getItem('dadaai_api_mode') || 'mock'; },
            get url() { return localStorage.getItem('dadaai_backend_url') || 'http://127.0.0.1:8000'; }
        };

        // Render Current Configuration
        function syncConfig() {
            document.getElementById('currentMode').textContent = settings.mode === 'live' ? 'Live (FastAPI)' : 'Mock Mode';
            const dot = document.getElementById('statusDot');
            dot.style.backgroundColor = settings.mode === 'live' ? '#a855f7' : '#22c55e';
        }
        syncConfig();

        // Listen for channel config changes or text responses
        bc.onmessage = (event) => {
            const data = event.data;
            if (data.type === 'CONFIG_CHANGED') {
                syncConfig();
            } else if (data.type === 'SMS_RECEIVED') {
                // If in Mock Mode, receiver page will broadcast back the mock AI response
                addChatBubble(`🤖 AI (Mock): ${data.body}`, 'received');
            } else if (data.type === 'SYNC_HISTORY') {
                // Receive incoming from voice responses or other updates
                if (data.role === 'assistant') {
                    addChatBubble(`🤖 AI: ${data.content}`, 'received');
                } else if (data.role === 'user') {
                    addChatBubble(`↩️ Dada Ji: ${data.content}`, 'received');
                }
            }
        };

        function sendSMS() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            doSend(text);
        }

        function quickSend(el) {
            doSend(el.textContent);
        }

        document.getElementById('msgInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendSMS();
        });

        function addChatBubble(text, type) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg-bubble msg-${type} fade-in`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function doSend(text) {
            addChatBubble(text, 'sent');
            bc.postMessage({ type: 'LOG', level: 'info', text: `4G phone sent SMS: "${text}"` });

            if (settings.mode === 'live') {
                // Live mode sends to FastAPI backend
                bc.postMessage({ type: 'LOG', level: 'info', text: `POST ${settings.url}/api/v1/sms/incoming ...` });
                try {
                    const response = await fetch(`${settings.url}/api/v1/sms/incoming`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ from_number: '+919876543210', body: text })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const resData = await response.json();
                    bc.postMessage({ type: 'LOG', level: 'success', text: `FastAPI responded. Body: "${resData.body}"` });
                    addChatBubble(`🤖 AI (Backend): ${resData.body}`, 'received');

                    // Broadcast to Dada Ji's phone tab that a live message arrived
                    bc.postMessage({
                        type: 'LIVE_SMS_ARRIVED',
                        original: text,
                        display: resData.body,
                        wasAI: true
                    });
                } catch (err) {
                    bc.postMessage({ type: 'LOG', level: 'error', text: `Failed live route: ${err.message}` });
                    addChatBubble(`❌ Error sending live SMS. Is Backend running?`, 'received');
                }
            } else {
                // Mock Mode: Broadcast the SMS to Dada Ji's tab
                bc.postMessage({
                    type: 'SMS_SENT',
                    text: text
                });
            }
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
